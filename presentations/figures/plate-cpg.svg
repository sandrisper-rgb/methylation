<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t2 d2">
  <title id="t2">Promoter CpG methylation as a gene-regulation switch</title>
  <desc id="d2">Left: an accessible promoter with few methyl marks and active transcription. Right: a hypermethylated promoter with dense 5mC and reduced transcription.</desc>
  <rect width="1200" height="420" fill="#f7f4ee"/>
  <rect x="18" y="18" width="1164" height="384" fill="#fffaf3" stroke="#123b5d" stroke-width="2"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="22" fill="#123b5d" font-weight="700">PLATE II | The CpG switch / El interruptor CpG</text>
  <text x="40" y="76" font-family="Helvetica, sans-serif" font-size="13" fill="#5a6d74">5-methylcytosine (5mC) at cytosine followed by guanine. / 5-metilcitosina (5mC) en citosina seguida de guanina.</text>
  <g transform="translate(50,108)">
    <rect width="530" height="260" rx="16" fill="#e9f5f2" stroke="#167d78" stroke-width="2"/>
    <text x="24" y="36" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#167d78">ACCESSIBLE PROMOTER</text>
    <text x="24" y="56" font-family="Helvetica, sans-serif" font-size="12" fill="#5a6d74">PROMOTOR ACCESIBLE</text>
    <path d="M40 130 C90 100, 150 160, 200 130 C250 100, 310 160, 360 130 C410 100, 460 140, 500 120" fill="none" stroke="#123b5d" stroke-width="6"/>
    <circle cx="120" cy="118" r="10" fill="#fff" stroke="#167d78" stroke-width="3"/>
    <circle cx="280" cy="142" r="10" fill="#fff" stroke="#167d78" stroke-width="3"/>
    <text x="112" y="90" font-size="11" fill="#167d78">CpG</text>
    <text x="272" y="114" font-size="11" fill="#167d78">CpG</text>
    <path d="M200 175 L200 210" stroke="#d39a38" stroke-width="4"/>
    <polygon points="200,228 190,208 210,208" fill="#d39a38"/>
    <text x="24" y="248" font-family="Helvetica, sans-serif" font-size="14" fill="#123b5d">Transcription can proceed / La transcripcion puede continuar</text>
  </g>
  <g transform="translate(620,108)">
    <rect width="530" height="260" rx="16" fill="#f3e6e4" stroke="#bc6159" stroke-width="2"/>
    <text x="24" y="36" font-family="Helvetica, sans-serif" font-size="16" font-weight="700" fill="#bc6159">HYPERMETHYLATED PROMOTER</text>
    <text x="24" y="56" font-family="Helvetica, sans-serif" font-size="12" fill="#5a6d74">PROMOTOR HIPERMETILADO</text>
    <path d="M40 130 C90 100, 150 160, 200 130 C250 100, 310 160, 360 130 C410 100, 460 140, 500 120" fill="none" stroke="#123b5d" stroke-width="6"/>
    <circle cx="120" cy="118" r="12" fill="#d39a38"/>
    <text x="108" y="92" font-size="11" fill="#8a5a12">CH3</text>
    <circle cx="200" cy="132" r="12" fill="#d39a38"/>
    <text x="188" y="106" font-size="11" fill="#8a5a12">CH3</text>
    <circle cx="280" cy="142" r="12" fill="#d39a38"/>
    <text x="268" y="116" font-size="11" fill="#8a5a12">CH3</text>
    <circle cx="360" cy="128" r="12" fill="#d39a38"/>
    <text x="348" y="102" font-size="11" fill="#8a5a12">CH3</text>
    <path d="M200 175 L200 198" stroke="#bc6159" stroke-width="4" stroke-dasharray="6 6"/>
    <text x="214" y="198" font-size="22" fill="#bc6159">x</text>
    <text x="24" y="248" font-family="Helvetica, sans-serif" font-size="14" fill="#123b5d">Reduced transcription may follow / Puede seguir menos transcripcion</text>
  </g>
</svg>
