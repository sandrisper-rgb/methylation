<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t5 d5">
  <title id="t5">Laboratory path from paired specimens to sequencing and ELISA</title>
  <desc id="d5">Blood splits into plasma for cfDNA and serum for sIgA. Tissue DNA is extracted and sheared. Both DNA sources enter EM-seq and NovaSeq 6000.</desc>
  <rect width="1200" height="430" fill="#f7f4ee"/>
  <rect x="18" y="18" width="1164" height="394" fill="#fffaf3" stroke="#123b5d" stroke-width="2"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="22" fill="#123b5d" font-weight="700">PLATE V | Wet-lab path / Ruta de laboratorio</text>
  <text x="40" y="76" font-family="Helvetica, sans-serif" font-size="13" fill="#5a6d74">Shear tissue DNA. Do not shear plasma cfDNA if fragmentomics is planned. / Fragmentar el ADN de tejido. No fragmentar el cfDNA plasmático si se planea fragmentómica.</text>
  <g font-family="Helvetica, sans-serif" font-size="13">
    <rect x="40" y="110" width="160" height="70" rx="12" fill="#123b5d"/>
    <text x="120" y="140" text-anchor="middle" fill="#fff" font-weight="700">Blood / Sangre</text>
    <text x="120" y="160" text-anchor="middle" fill="#cfe7e2" font-size="11">plasma + serum</text>
    <rect x="40" y="250" width="160" height="70" rx="12" fill="#123b5d"/>
    <text x="120" y="280" text-anchor="middle" fill="#fff" font-weight="700">Biopsy / Biopsia</text>
    <text x="120" y="300" text-anchor="middle" fill="#cfe7e2" font-size="11">colonic tissue</text>
    <rect x="250" y="92" width="180" height="54" rx="10" fill="#167d78"/>
    <text x="340" y="125" text-anchor="middle" fill="#fff" font-weight="700">PANAMAX cfDNA</text>
    <rect x="250" y="154" width="180" height="54" rx="10" fill="#d39a38"/>
    <text x="340" y="187" text-anchor="middle" fill="#123b5d" font-weight="700">sIgA ELISA</text>
    <rect x="250" y="240" width="180" height="54" rx="10" fill="#167d78"/>
    <text x="340" y="262" text-anchor="middle" fill="#fff" font-weight="700">PANAMAX gDNA</text>
    <text x="340" y="280" text-anchor="middle" fill="#dff1ec" font-size="11">tissue / tejido</text>
    <rect x="250" y="302" width="180" height="48" rx="10" fill="#bc6159"/>
    <text x="340" y="332" text-anchor="middle" fill="#fff" font-weight="700">UltraShear</text>
    <rect x="500" y="160" width="200" height="90" rx="12" fill="#14546a"/>
    <text x="600" y="198" text-anchor="middle" fill="#fff" font-weight="700">NEBNext EM-seq</text>
    <text x="600" y="220" text-anchor="middle" fill="#cfe7e2" font-size="12">library / librería</text>
    <rect x="770" y="160" width="180" height="90" rx="12" fill="#0d3048"/>
    <text x="860" y="198" text-anchor="middle" fill="#fff" font-weight="700">NovaSeq 6000</text>
    <text x="860" y="220" text-anchor="middle" fill="#f4c66e" font-size="12">paired-end FASTQ</text>
    <rect x="1000" y="154" width="160" height="102" rx="12" fill="#e9f5f2" stroke="#167d78"/>
    <text x="1080" y="196" text-anchor="middle" fill="#123b5d" font-weight="700">Analysis</text>
    <text x="1080" y="218" text-anchor="middle" fill="#5a6d74" font-size="12">methylation</text>
    <text x="1080" y="236" text-anchor="middle" fill="#5a6d74" font-size="12">+ sIgA table</text>
    <path d="M200 145 H250" stroke="#167d78" stroke-width="3"/>
    <path d="M200 285 H250" stroke="#167d78" stroke-width="3"/>
    <path d="M430 119 H500" stroke="#167d78" stroke-width="3"/>
    <path d="M430 329 H470 V205 H500" stroke="#167d78" stroke-width="3"/>
    <path d="M700 205 H770" stroke="#167d78" stroke-width="3"/>
    <path d="M950 205 H1000" stroke="#167d78" stroke-width="3"/>
    <path d="M430 181 H470 V205" stroke="#d39a38" stroke-width="3"/>
  </g>
</svg>
