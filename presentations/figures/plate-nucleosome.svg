<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t7 d7">
  <title id="t7">Nucleosome-protected cell-free DNA in plasma</title>
  <desc id="d7">DNA wraps around histone octamers. Nuclease cleavage of linker DNA yields plasma fragments with a mono-nucleosomal mode near 167 base pairs.</desc>
  <rect width="1200" height="320" fill="#f7f4ee"/>
  <rect x="18" y="18" width="1164" height="284" fill="#0e354f"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="20" fill="#f4c66e" font-weight="700">PLATE VII | Plasma fragments are not random / Los fragmentos plasmaticos no son aleatorios</text>
  <g fill="#65d0bd">
    <circle cx="160" cy="150" r="38"/>
    <circle cx="310" cy="150" r="38"/>
    <circle cx="460" cy="150" r="38"/>
    <circle cx="610" cy="150" r="38"/>
  </g>
  <path d="M90 150 C120 150, 130 150, 160 150" stroke="#f4c66e" stroke-width="8" fill="none"/>
  <path d="M198 150 C230 118, 270 182, 310 150" stroke="#f4c66e" stroke-width="8" fill="none"/>
  <path d="M348 150 C380 118, 420 182, 460 150" stroke="#f4c66e" stroke-width="8" fill="none"/>
  <path d="M498 150 C530 118, 570 182, 610 150" stroke="#f4c66e" stroke-width="8" fill="none"/>
  <path d="M648 150 C700 150, 740 150, 780 150" stroke="#f4c66e" stroke-width="8" fill="none"/>
  <text x="160" y="155" text-anchor="middle" fill="#0e354f" font-size="11" font-weight="700" font-family="Helvetica, sans-serif">histone</text>
  <text x="310" y="155" text-anchor="middle" fill="#0e354f" font-size="11" font-weight="700" font-family="Helvetica, sans-serif">histone</text>
  <text x="460" y="155" text-anchor="middle" fill="#0e354f" font-size="11" font-weight="700" font-family="Helvetica, sans-serif">histone</text>
  <text x="610" y="155" text-anchor="middle" fill="#0e354f" font-size="11" font-weight="700" font-family="Helvetica, sans-serif">histone</text>
  <text x="244" y="112" fill="#bc6159" font-size="16" font-weight="700">cut</text>
  <text x="394" y="198" fill="#bc6159" font-size="16" font-weight="700">cut</text>
  <text x="544" y="112" fill="#bc6159" font-size="16" font-weight="700">cut</text>
  <rect x="820" y="88" width="320" height="160" rx="14" fill="#123b5d"/>
  <text x="980" y="128" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="Helvetica, sans-serif">mono-nucleosomal mode</text>
  <text x="980" y="156" text-anchor="middle" fill="#f4c66e" font-size="28" font-weight="700" font-family="Georgia, serif">~167 bp</text>
  <text x="980" y="186" text-anchor="middle" fill="#cfe7e2" font-size="13" font-family="Helvetica, sans-serif">protected DNA / ADN protegido</text>
  <text x="980" y="210" text-anchor="middle" fill="#cfe7e2" font-size="12" font-family="Helvetica, sans-serif">linker DNA is cut / el ADN conector se corta</text>
  <text x="40" y="270" fill="#cfe7e2" font-size="13" font-family="Helvetica, sans-serif">EM-seq does not sequence histones. Packing is inferred from fragment size, ends, and coverage.</text>
  <text x="40" y="290" fill="#cfe7e2" font-size="12" font-family="Helvetica, sans-serif">EM-seq no secuencia histonas. El empaquetamiento se infiere del tamano, los extremos y la cobertura.</text>
</svg>
