<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t3 d3">
  <title id="t3">Eighteen planned participants across three clinical groups</title>
  <desc id="d3">Eight ulcerative colitis, five colorectal cancer, and five healthy comparator participants. Pairing is within person.</desc>
  <rect width="1200" height="430" fill="#f7f4ee"/>
  <rect x="18" y="18" width="1164" height="394" fill="#fffaf3" stroke="#123b5d" stroke-width="2"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="22" fill="#123b5d" font-weight="700">PLATE III | Planned cohort / Cohorte prevista</text>
  <text x="40" y="76" font-family="Helvetica, sans-serif" font-size="13" fill="#5a6d74">18 people, 36 paired DNA specimens, plus serum for sIgA ELISA / 18 personas, 36 especimenes de ADN pareados, mas suero para ELISA de sIgA</text>
  <g font-family="Helvetica, sans-serif">
    <text x="60" y="118" font-size="15" font-weight="700" fill="#167d78">UC / CU | 8</text>
    <g fill="#167d78">
      <circle cx="80" cy="155" r="16"/><circle cx="120" cy="155" r="16"/><circle cx="160" cy="155" r="16"/><circle cx="200" cy="155" r="16"/>
      <circle cx="80" cy="195" r="16"/><circle cx="120" cy="195" r="16"/><circle cx="160" cy="195" r="16"/><circle cx="200" cy="195" r="16"/>
    </g>
    <text x="60" y="238" font-size="12" fill="#5a6d74">high-risk disease group</text>
    <text x="60" y="256" font-size="12" fill="#5a6d74">grupo de enfermedad de alto riesgo</text>
    <text x="360" y="118" font-size="15" font-weight="700" fill="#bc6159">CRC / CCR | 5</text>
    <g fill="#bc6159">
      <circle cx="380" cy="155" r="16"/><circle cx="420" cy="155" r="16"/><circle cx="460" cy="155" r="16"/>
      <circle cx="380" cy="195" r="16"/><circle cx="420" cy="195" r="16"/>
    </g>
    <text x="360" y="238" font-size="12" fill="#5a6d74">neoplastic comparator</text>
    <text x="360" y="256" font-size="12" fill="#5a6d74">comparador neoplasico</text>
    <text x="640" y="118" font-size="15" font-weight="700" fill="#d39a38">Healthy / Sanos | 5</text>
    <g fill="#d39a38">
      <circle cx="660" cy="155" r="16"/><circle cx="700" cy="155" r="16"/><circle cx="740" cy="155" r="16"/>
      <circle cx="660" cy="195" r="16"/><circle cx="700" cy="195" r="16"/>
    </g>
    <text x="640" y="238" font-size="12" fill="#5a6d74">reference group</text>
    <text x="640" y="256" font-size="12" fill="#5a6d74">grupo de referencia</text>
  </g>
  <g transform="translate(900,108)">
    <rect width="250" height="250" rx="16" fill="#123b5d"/>
    <text x="125" y="48" text-anchor="middle" fill="#f4c66e" font-size="13" font-weight="700" font-family="Helvetica, sans-serif">ONE PARTICIPANT</text>
    <text x="125" y="68" text-anchor="middle" fill="#cfe7e2" font-size="11" font-family="Helvetica, sans-serif">UNA PERSONA</text>
    <circle cx="70" cy="130" r="34" fill="#167d78"/>
    <text x="70" y="126" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="Helvetica, sans-serif">plasma</text>
    <text x="70" y="142" text-anchor="middle" fill="#dff1ec" font-size="10" font-family="Helvetica, sans-serif">cfDNA</text>
    <circle cx="180" cy="130" r="34" fill="#d39a38"/>
    <text x="180" y="126" text-anchor="middle" fill="#123b5d" font-size="11" font-weight="700" font-family="Helvetica, sans-serif">tissue</text>
    <text x="180" y="142" text-anchor="middle" fill="#3c2d16" font-size="10" font-family="Helvetica, sans-serif">tejido</text>
    <rect x="48" y="186" width="154" height="36" rx="8" fill="#fff"/>
    <text x="125" y="209" text-anchor="middle" fill="#123b5d" font-size="12" font-weight="700" font-family="Helvetica, sans-serif">serum sIgA</text>
  </g>
</svg>
