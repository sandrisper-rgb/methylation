<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="t6 d6">
  <title id="t6">Computational stack from FASTQ to DSS and pathway interpretation</title>
  <desc id="d6">fastp, bwa-meth to GRCh38, MethylDackel, DSS, then KEGG and Reactome, with sIgA joining at integration.</desc>
  <rect width="1200" height="250" fill="#f7f4ee"/>
  <rect x="12" y="12" width="1176" height="226" fill="#fffaf3" stroke="#123b5d" stroke-width="2"/>
  <text x="32" y="42" font-family="Georgia, serif" font-size="18" fill="#123b5d" font-weight="700">PLATE VI | Compute stack / Pila computacional</text>
  <g font-family="Helvetica, sans-serif">
    <rect x="30" y="70" width="150" height="130" rx="12" fill="#123b5d"/>
    <text x="105" y="128" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">fastp</text>
    <text x="105" y="150" text-anchor="middle" fill="#cfe7e2" font-size="11">adapter + QC</text>
    <rect x="200" y="70" width="170" height="130" rx="12" fill="#167d78"/>
    <text x="285" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">bwa-meth</text>
    <text x="285" y="142" text-anchor="middle" fill="#dff1ec" font-size="12">GRCh38</text>
    <text x="285" y="162" text-anchor="middle" fill="#dff1ec" font-size="11">paired BAM</text>
    <rect x="390" y="70" width="180" height="130" rx="12" fill="#14546a"/>
    <text x="480" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">MethylDackel</text>
    <text x="480" y="144" text-anchor="middle" fill="#cfe7e2" font-size="12">CpG counts M/N</text>
    <rect x="590" y="70" width="160" height="130" rx="12" fill="#d39a38"/>
    <text x="670" y="120" text-anchor="middle" fill="#123b5d" font-size="18" font-weight="700">DSS</text>
    <text x="670" y="142" text-anchor="middle" fill="#3c2d16" font-size="12">beta-binomial</text>
    <text x="670" y="162" text-anchor="middle" fill="#3c2d16" font-size="11">DML -&gt; DMR</text>
    <rect x="770" y="70" width="190" height="130" rx="12" fill="#bc6159"/>
    <text x="865" y="120" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">KEGG / Reactome</text>
    <text x="865" y="144" text-anchor="middle" fill="#f8eaea" font-size="12">hypothesis, not proof</text>
    <text x="865" y="164" text-anchor="middle" fill="#f8eaea" font-size="11">hipotesis, no prueba</text>
    <rect x="980" y="70" width="180" height="130" rx="12" fill="#0d3048"/>
    <text x="1070" y="112" text-anchor="middle" fill="#f4c66e" font-size="14" font-weight="700">INTEGRATION</text>
    <text x="1070" y="136" text-anchor="middle" fill="#fff" font-size="12">+ serum sIgA</text>
    <text x="1070" y="156" text-anchor="middle" fill="#cfe7e2" font-size="11">Nextflow + containers</text>
  </g>
</svg>
