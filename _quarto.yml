project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "findings/**/*.qmd"
    - "workflows/**/*.qmd"
    - "posts/**/*.qmd"
  resources:
    - presentations/files/**
    - publications/files/**
    - media/**
  preview:
    port: 4200
    browser: true

website:
  title: "Methylation & Colitis"
  description: "Integrating DNA methylation and sIgA to investigate colitis progression"
  site-url: "https://sandrisper-rgb.github.io/methylation"
  repo-url: "https://github.com/sandrisper-rgb/methylation"
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
      - text: Study
        menu:
          - href: research.qmd
            text: Design & cohorts
          - href: approach.qmd
            text: Methylation vs sIgA
          - href: roadmap.qmd
            text: Experimental roadmap
      - text: Methods
        menu:
          - href: sequencing-methods.qmd
            text: Sequencing & pipelines
          - href: siga-methods.qmd
            text: sIgA data & rationale
          - href: technology.qmd
            text: cfDNA technology landscape
          - href: workflows/index.qmd
            text: Reproducible workflows
      - href: findings/index.qmd
        text: Findings
      - href: posts/index.qmd
        text: Field Notes
      - href: publications.qmd
        text: Literature Review
      - text: Resources
        menu:
          - href: resources.qmd
            text: Project media
          - href: presentations.qmd
            text: Presentations
          - href: related-work.qmd
            text: Research groups
          - href: team.qmd
            text: Team
          - href: contributing.qmd
            text: Contribute
  page-footer:
    left: "Methylation + sIgA · PCI-2024-0016"
    center: "Universidad El Bosque"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    code-copy: true
    code-fold: show
    link-external-newwindow: true

execute:
  freeze: auto
  warning: false

bibliography: references.bib
csl: apa.csl
